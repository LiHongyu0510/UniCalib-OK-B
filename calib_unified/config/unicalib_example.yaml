# =============================================================================
# UniCalib 统一配置 — 多传感器显式标定对 + 双数据源（ROS2 bag / 文件）
# =============================================================================
#
# 【术语表】
#   sensor_id      sensors 中定义的唯一 ID（如 imu_0 单 IMU, lidar_main, center_front）
#   标定对         外参标定的一对传感器，如 [imu_0, lidar_main]
#   reference      外参 T_target_in_ref 中的参考系（第一个 id）
#   target         待标定系（第二个 id）
#   数据源         每个传感器数据来源：ros2_bag（按 topic 从 bag 读）或 files（PCD/图像目录）
#
# 【任务与用法】
#   --task imu-intrin       IMU 内参
#   --task cam-intrin      相机内参
#   --task imu-lidar       IMU-LiDAR 外参（按 imu_lidar.pairs 执行）
#   --task lidar-lidar     LiDAR-LiDAR 外参（按 lidar_lidar.pairs 执行）
#   --task lidar-cam       LiDAR-相机 外参（按 lidar_camera.pairs 执行）
#   --task cam-cam         相机-相机 外参（按 cam_cam.pairs / camera_align 执行）
#   --task joint           联合标定
#
# 【数据源】
#   LiDAR：ROS2 bag（PointCloud2 话题）或 文件目录（目录内 .pcd）
#   Camera：ROS2 bag（Image 话题）或 文件目录（.png / .jpg）
#   IMU：   ROS2 bag（Imu 话题）或 CSV 文件
#   ros2.ros2_bag_file：填相对于 --data-dir 的路径；rosbag2 格式为目录（含 metadata.yaml 与 .db3），不要写 .bag 后缀。
#   未填 data.lidar/<id> 或 data.camera/<id>.images_dir 且 ros2.use_ros2_bag=true 时，从 bag 按 sensors[].topic 读取。
#   LiDAR-LiDAR（unicalib_lidar_lidar）：与 LiDAR-Cam 相同，会合并 sensors[] 中 LiDAR 的 topic；pairs 中的 id 必须与 sensors[].id 一致（或另配 ros2.lidar_topics / data.lidar 传感器 YAML）。
#
# 【配置与代码适配】
#   当前 C++ 已支持：cam_cam.camera_align（显式对）、lidar_camera.camera_list（单 LiDAR 多相机）。
#   新增 imu_lidar.pairs、lidar_lidar.pairs、lidar_camera.pairs 后，需在 joint_calib / imu_lidar_extrin /
#   lidar_camera_extrin 等 app 中优先读取 pairs，无 pairs 时回退到“第一个 IMU+第一个 LiDAR”或 camera_list。
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 任务开关（joint 时生效；单任务由命令行 --task 决定）
# -----------------------------------------------------------------------------
auto_tasks:                 false
do_imu_intrinsic:           true
do_camera_intrinsic:        true
do_imu_lidar_extrinsic:     true   # 文件模式：配置 data.imu / data.lidar；或 new_format / ros2 bag
do_lidar_lidar_extrinsic:   false   # 多 LiDAR 时置 true，并按 lidar_lidar.pairs 标定
do_lidar_camera_extrinsic:  true
do_cam_cam_extrinsic:       false
do_joint_bspline_refine:    false   # joint 涉及多任务链路，当前建议先关闭（仅保留 lidar-cam NEW_FORMAT）
# 相机-相机：是否用 params 中已有外参作初值；有初值时是否跳过粗标定（可加速、避免粗标定带偏）
# use_cam_cam_initial_from_params: true
# use_cam_cam_skip_coarse_when_initial: true

verbose: true

# -----------------------------------------------------------------------------
# 2. 输出与结果目录
# -----------------------------------------------------------------------------
output_dir: ./results

# results 子目录名：标定结果写入 output_dir/<名>/；imu_intrinsic 同时作为 IMU-LiDAR 等外参标定时的内参读取路径
results:
  imu_intrinsic:       imu_intrinsic
  camera_intrinsic:    camera_intrinsic
  imu_lidar_extrinsic: imu_lidar_extrinsic
  lidar_lidar_extrinsic: lidar_lidar_extrinsic
  lidar_camera_extrinsic: lidar_camera_extrinsic
  cam_cam_extrinsic:   cam_cam_extrinsic
  joint:               joint

# -----------------------------------------------------------------------------
# 2.1 手动校准（可选）
# -----------------------------------------------------------------------------
# 当精标定 RMS 超过阈值时，是否进入 6-DOF 键盘手动调整（需带 --manual 或此处为 true）
# allow_manual_fallback: true
# LiDAR-Cam / Cam-Cam 应用可读：manual_rms_threshold（触发手动的 RMS 阈值 [px]）
# manual_rms_threshold: 2.0
# 详见 docs/MANUAL_EXTRINSIC_ADJUSTMENT.md

# =============================================================================
# 3. 传感器定义（可多 IMU、多 LiDAR、多 Camera）
# =============================================================================
# 每个传感器：id（唯一）、type、topic（ROS2 时使用）。数据来源由 data 段与 ros2 段决定。
sensors:
  # 单车仅一个 INS/IMU：盒子导航中心原点 (792.7, 569.8, 0) mm，安装 Y 前 X 右 Z 上（见安装说明表）
  - id: imu_0
    type: imu
    topic: /imu/imu_0
    imu:
      rate_hz: 100.0
      model: scale_misalignment

  - id: lidar_main
    type: lidar
    topic: /lidar/main/points
    lidar:
      type: spinning
      scan_lines: 32
      rate_hz: 10.0

  - id: left_front
    type: lidar
    topic: /lidar/left_front/points
    lidar:
      type: spinning
      scan_lines: 32
      rate_hz: 10.0

  - id: right_back
    type: lidar
    topic: /lidar/right_back/points
    lidar:
      type: spinning
      scan_lines: 32
      rate_hz: 10.0

  # 多 LiDAR 示例（用于 lidar-lidar 外参）
  # - id: lidar_rear
  #   type: lidar
  #   topic: /os1_cloud_node2/points
  #   lidar: { type: spinning, scan_lines: 32, rate_hz: 10.0 }

  - id: center_front
    type: camera
    topic: /camera/center_front/image_raw
    camera:
      model: pinhole
      width: 1920
      height: 1536
      fps: 30.0
      rolling_shutter: false
  
  - id: surrounding_front
    type: camera
    topic: /camera/surrounding_front/image_raw
    camera:
      model: fisheye
      width: 1920
      height: 1080
      fps: 30.0
      rolling_shutter: false

  - id: surrounding_back
    type: camera
    topic: /camera/surrounding_back/image_raw
    camera:
      model: fisheye
      width: 1920
      height: 1080
      fps: 30.0
      rolling_shutter: false

  - id: surrounding_left
    type: camera
    topic: /camera/surrounding_left/image_raw
    camera:
      model: fisheye
      width: 1920
      height: 1080
      fps: 30.0
      rolling_shutter: false

  - id: surrounding_right
    type: camera
    topic: /camera/surrounding_right/image_raw
    camera:
      model: fisheye
      width: 1920
      height: 1080
      fps: 30.0
      rolling_shutter: false
  # - id: cam_right
  #   type: camera
  #   topic: /right/image_raw
  #   camera: { model: pinhole, width: 1280, height: 720 }

reference_imu: imu_0

# =============================================================================
# 4. 数据路径（支持 ROS2 bag 与 文件 两种输入）
# =============================================================================
# 路径可为相对 --data-dir 或绝对路径。
# - 使用 bag 时：可不填对应 data.imu/data.lidar/data.camera，由 ros2 段 + sensors[].topic 提供。
# - 使用文件时：必填对应项。LiDAR 填点云目录（内含 .pcd），相机填 images_dir（内含 .png/.jpg）。
data:
  # 旧版兼容：单 bag 路径（与 ros2.ros2_bag_file 二选一即可）
  # 为避免混淆，这里与 ros2.ros2_bag_file 保持一致，均为相对于 --data-dir 的路径
  bag_file: ""

  # IMU：sensor_id -> CSV 路径（文件模式）；bag 模式可留空，按 topic 从 bag 读
  imu:
    imu_0: imu/imu/imu_0/imu.csv

  # LiDAR：sensor_id -> PCD 目录，或传感器 YAML（含 pointcloud_topic）
  lidar:
    # nya 双雷达：front=水平雷达 YAML，rear=垂直雷达 YAML（与 lidar_lidar.pairs 的 lidar_front/lidar_rear 一致）
    # 纯 bag 时可仅依赖 sensors[].topic；本处 YAML 同时提供 pointcloud_topic 与 IMU-LiDAR 等任务常用外参描述
    # # PCD 目录（文件名如 frame_<timestamp>.pcd，时间戳从文件名解析）；路径相对 CALIB_DATA_DIR（默认 <工程>/data）
    # IMU-LiDAR 须与 data.imu 同一次采集：当前 imu.csv 为 0518 → 用 top_front_0518（约 314s 重叠）
    # 0519 主雷达 top_front_0519 与 0519 RAWIMU 时段不重叠，待同步数据后再改路径
    lidar_main: lidar_main/top_front_0603_1/front
    left_front: lidar_airy/20260603_1/front/left_front
    right_back: lidar_airy/20260603_1/front/right_back

    # lidar_main: lidar_main/top_front_0603
    # left_front: lidar_airy/20260603/left_front
    # right_back: lidar_airy/20260603/right_back

  # 相机：sensor_id -> { images_dir（必填文件模式）, intrinsic_yaml（可选）, reference_intrinsic_yaml（可选）}
  # intrinsic_yaml：厂家内参或标定结果；相对 --data-dir。五路可共用 camera_intrinsic/camera_intrinsic.yaml（cameras 映射）
  # 单相机文件格式：<output_dir>/<results.camera_intrinsic>/camera_intrinsic_<sensor_id>.yaml
  camera:
    camera_num: 5
    center_front:
      images_dir: Camera/center_front/3302_2
      intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    surrounding_front:
      images_dir: Camera/surrounding_front/3302_2
      intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    surrounding_back:
      images_dir: Camera/surrounding_back/3302_2
      intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    surrounding_left:
      images_dir: Camera/surrounding_left/3302_2
      intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    surrounding_right:
      images_dir: Camera/surrounding_right/3302_2
      intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    # camera_num: 5
    # center_front:
    #   images_dir: test/center
    #   intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    # surrounding_front:
    #   images_dir: test/front
    #   intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    # surrounding_back:
    #   images_dir: test/back
    #   intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    # surrounding_left:
    #   images_dir: test/left
    #   intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml

    # surrounding_right:
    #   images_dir: test/right
    #   intrinsic_yaml: camera_intrinsic/camera_intrinsic.yaml
# =============================================================================
# 5. ROS2 数据源（与 data 段二选一或混用：未提供文件路径时从 bag 读）
# =============================================================================
ros2:
  use_ros2_bag: false
  # rosbag2 格式为目录（内含 metadata.yaml + .db3），不要写 .bag 后缀
  ros2_bag_file: ""

  # 单话题（仅一个 LiDAR/相机时）；多传感器时用下面 topic 映射
  # lidar_topic: /os1_cloud_node1/points
  # camera_num: 2
  # camera_topic: [/left/image_raw, /right/image_raw]
  # imu_topic: /dji_sdk/imu

  # 多传感器时：sensor_id -> topic，与 sensors[].id 对应（相机内参标定会标定所有 sensors 中的相机）
  # lidar_topics:  { lidar_front: /os1_cloud_node1/points, lidar_rear: /os1_cloud_node2/points }
  #
  # LiDAR-LiDAR（unicalib_lidar_lidar）：bag 读帧时话题优先级：data.lidar 传感器 YAML 的 pointcloud_topic >
  # ros2.lidar_topics > sensors[].topic（须与 lidar_lidar.pairs 的 id 一致）。
  # 话题名须与 bag/metadata 中一致：ros2 bag info <bag目录>
  # 可选（与其它任务共用配置或未在 YAML 写 pointcloud_topic 时启用）:
  # lidar_topics:
  #   lidar_horz: /os1_cloud_node1/points
  #   lidar_vert: /os1_cloud_node2/points
  camera_topics: {}
  imu_topics: {}

  strict_topic_match: true
  max_wait_time: 30.0
  sample_interval: 0.0
  # IMU-LiDAR 建议 0=不限制；800 只会加载前 800 帧 IMU（约 8s），与长 LiDAR 段不对齐
  max_frames: 0

# =============================================================================
# 5.1 新采集格式数据源（索引 CSV）
# =============================================================================
# 说明：
# - 启用后（enable=true），lidar-cam 将优先走 NEW_FORMAT 数据源
# - root_dir 下建议目录：
#     lidar/lidar_main.csv       (timestamp,path)
#     camera/center_front.csv    (timestamp,path)
#     imu/imu_0.csv              (timestamp,gx,gy,gz,ax,ay,az)
# - path 推荐写相对 root_dir 的路径（如 pcd/xxx.pcd, images/xxx.png）
new_format:
  enable: false
  max_frames: 0
  sample_interval: 0   # 仅 LiDAR/相机降采样(s)；IMU 始终全率。0.5≈604 帧 LiDAR；0=3018 帧 NDT 很慢
  # 与一键脚本配合建议写 "."：最终解析为 CALIB_DATA_DIR（容器内通常是 /root/calib_ws/data）
  # 若不走脚本直接本机运行，可改成绝对路径（如 /data 或 /path/to/dataset）
  root_dir: .
  timestamp_unit: us   # s | ms | us | ns（大小写不敏感）
  # Bynav / NovAtel OEM7 短二进制 CORRIMUDATAS（索引 CSV 两列：占位,oem7.bin）时的 IMU 输出频率 Hz，与 INSHandler 的 imu_rate 一致
  oem7_imu_rate_hz: 100
  # RAWIMUSX 比例因子（与 bynav_ros_driver/config/config.yaml 一致；HG4930 常用值）
  oem7_imu_gyro_scale_factor: 1.9073486328125e-07
  oem7_imu_accel_scale_factor: 3.05071567298197e-08
  # OEM7/北云文本 IMU 时间戳：unix=与 LiDAR/相机索引对齐（推荐）；gps=GPST 连续秒
  # Bynav CORRIMU 为 GPST、RAWIMU 为 Unix，解码器按数值自动识别，不会重复换算
  oem7_time_base: unix   # gps | unix
  oem7_gps_utc_leap_sec: 18   # 仅 unix 模式；以 IERS 公布为准，会随年代变化
  oem7_time_offset_sec: 0    # 全体 IMU 时间再加/减的秒数（细调与其它传感器钟差）
  lidar_index_files:
    lidar_main: ""
    # 补盲索引文件就绪后再取消注释
    # left_front: lidar/left_front.csv
    # right_back: lidar/right_back.csv
  camera_index_files:
    center_front: Camera/center_front/3301/index.csv
    surrounding_front: Camera/surrounding_front/3301/index.csv
    surrounding_back: Camera/surrounding_back/3301/index.csv
    surrounding_left: Camera/surrounding_left/3301/index.csv
    surrounding_right: Camera/surrounding_right/3301/index.csv
  imu_index_files:
    imu_0: imu/imu/imu_1/imu_index.csv

# =============================================================================
# 6. 第三方 / AI 标定
# =============================================================================
third_party:
  dm_calib: ""
  dm_calib_model: "DM-Calib/model/calib2"
  # MIAS-LCEC 粗标定（LiDAR-Cam）：二选一
  # 1) 使用内置粗标定脚本（几何恒等/PnP）：repo_dir 指向 calib_unified 所在目录，calib_script 指向 scripts/run_lidar_cam_coarse.py
  # 2) 使用 MIAS-LCEC 仓库（Overlap Transformer）：repo_dir 填 ai_root/MIAS-LCEC，model_path 指向 pretrained_overlap_transformer.pth.tar
  mias_lcec:
    repo_dir: "calib_unified"   # 内置脚本时用 "calib_unified"；真实模型时用 "MIAS-LCEC"（相对 ai_root）
    calib_script: "scripts/run_lidar_cam_coarse.py"
    # 模型路径：填 mobile_sam.pt 则仅用 SAM 粗标定（推荐）；填 .pth.tar 则 OverlapTransformer+SAM+C3M；置空则仅 PnP/几何
    model_path: "MIAS-LCEC/model/mobile_sam.pt"
    # 已配置 model_path 但推理不可用时是否允许回退 PnP：true=允许（默认，流水线可跑通）；false=必须用模型否则粗标定失败
    allow_pnp_fallback: true
    # 粗标定子进程 Python（可选）：LcMatch_CApi 需 Python 3.10 时可填 MIAS-LCEC 虚拟环境解释器；也可用环境变量 UNICALIB_MIAS_LCEC_PYTHON
    # python_exe: "/path/to/MIAS-LCEC/bin/python"
  dm_calib_use_cpu: true
  dm_calib_timeout_sec: 6000
  dm_calib_denoise_steps: 10
  dm_calib_ensemble_size: 1
  dm_calib_processing_res: 512
  dm_calib_max_images: 25

# =============================================================================
# 7. IMU 内参
# =============================================================================
imu_intrinsic:
  static_gyro_thresh: 0.05
  static_detect_window: 0.5
  min_static_frames: 50
  allan_num_tau_points: 50
  use_transformer_fallback_when_insufficient_static: true
  transformer_imu_mean_only: false

# =============================================================================
# 8. 相机内参
# =============================================================================
camera_intrinsic:
  prefer_no_checkerboard: true
  min_images: 15
  max_images: 100
  max_rms_px: 1.5
  refine_corners: true
  subpix_max_iter: 30
  subpix_epsilon: 0.01
  outlier_rejection_sigma: 0
  calibrate_max_iter: 100
  calibrate_epsilon: 1e-7
  rational_model: false
  target: { type: chessboard, cols: 7, rows: 5, square_size: 0.05 }
  model: pinhole

# =============================================================================
# 9. IMU-LiDAR 外参 — 显式标定对
# =============================================================================
# pairs: 每项 [imu_id, lidar_id]，表示标定 T_lidar_in_imu（LiDAR 在 IMU 系下）
# 多 IMU、多 LiDAR 时按需列举所有需要标定的 (imu, lidar) 对。
imu_lidar:
  pairs:
    - [imu_0, lidar_main]
    # - [imu_0, left_front]
    # - [imu_0, right_back]
  # 初值（可选）：粗标定以初值为先验开始（手眼 180° 消解与平移回退），得到粗结果；若粗结果偏离初值过大则粗结果取初值；精标定在粗标定结果上 B 样条精化。
  # 键: "imu_id__lidar_id" 或 "T_imu_id__lidar_id"。推荐写法（与安装表一致）：
  #   rows/cols: 3，data: 9 个数（旋转 R，行优先），translation: [tx, ty, tz]（米）
  # 亦支持 4x4 内联或初值文件路径（文件内 T_Imu_Lidar 可为 3x3+translation 或 4x4）。
  # 语义: T_Imu_Lidar，p_imu = T * p_lidar（与 results 输出 4x4 一致）。
  # 安装表 mm→m（V 系后上左；r 为传感器中心）
  #   r_imu=(792.7, 569.8, 0)
  #   主雷达 r=(776.16, 876.11, 0)     → delta_V=(-0.01654, 0.30631, 0) [m]
  # T_Imu_Lidar: p_imu = R * p_lidar + t
  #   R = R_Imu←lidar_nominal * R_y_lidar(前倾4.08°)
  #       轴对齐: lidar(前左上)→imu(右前上): X_l→Y_i, Y_l→-X_i, Z_l→Z_i
  #       前倾: 绕 lidar Y(左) +4.08°（Z 向前倾）
  #   t = R_Imu←V * delta_V，R_Imu←V: V(后,上,左)→IMU(右,前,上)
  #   → t = [0, 0.01654, 0.30631] m；det(R)=1，SVD 正交化不改变 R
  #   left_front   r=(-37.49, 530.31, 430.63) → t=(-0.83019, -0.03949,  0.43063)
  #   right_back   r=(1539.14, 705.48, -501.01) → t=(0.74644, 0.13568, -0.50101)
  initial_extrinsics:
    T_imu_0__lidar_main:
      rows: 3
      cols: 3
      dt: d
      data: [0.00365937, 0.99747180, -0.07096909,
             -0.98824432, 0.01445425, 0.15219800,
              0.15283902, 0.06957785, 0.98579874]
      translation: [0.01600892, -0.03036198, -0.30482987]
      # data: [-0.00349065, 0.99505011, -0.09931308,
      #        -0.99999238, -0.00330005, 0.00208338,
      #         0.00174533, 0.09931960, 0.99505405]
      # translation: [0.01600892, -0.03036198, -0.30482987]

    T_imu_0__left_front:
      rows: 3
      cols: 3
      dt: d
      data: [-0.30144669916816969, 0.95252335380456077, -0.042768540044354722,
           0.95316537433858883, 0.30220070994685833, 0.012267846982742952,
           0.02461009391675811, -0.037067389502444259, -0.99900968559513004]
      translation: [-0.94109095437021884, 0.24318668104107136, 0.007548942365885547]
      
    T_imu_0__right_back:
      rows: 3
      cols: 3
      dt: d
      data: [0.3023395387399086, -0.95277675881135981, 0.028412166116981833,
         -0.9530957800746076, -0.30173067514302176, 0.023812469038534081,
         -0.014115145005077745, -0.034278966534242887, -0.9993126213226915]
      translation: [-0.85211532802620082, 0.23791194780423403, 0.17371279604563639]

  ndt_resolution: 0.8
  ndt_max_iter: 30
  spline_dt_s: 0.1
  spline_order: 4
  optimize_time_offset: true
  time_offset_init: 0.0
  time_offset_max: 0.2
  trim_to_overlap: true
  trim_overlap_margin_s: 0.05
  imu_integrate_margin_s: 0.05   # LiDAR 10Hz 帧时刻外扩取 IMU，缓解窗内无样本
  min_motion_rot_deg: 0.15      # 0518 路测：略降低以保留更多旋转对
  min_motion_rot_deg_short: 0.1
  rot_pair_dt_target_s: 0.2     # 短时窗长度；10Hz LiDAR 时由代码自动补短时窗（相邻 NDT 转角常过小）
  rot_pair_short_step_s: 0.1
  handeye_fix_180_ambiguity: true
  handeye_180_decision: residual   #residual   # 有 3x3+translation 初值时，会结合初值距离消解 180° 歧义
  handeye_prefer_identity_when_ambiguous: false
  handeye_180_residual_margin_deg: 3.0
  handeye_ratio_min: 0           # LiDAR/IMU 角比值常 <0.1，勿用 0.15~0.6 滤掉几乎全部对
  handeye_ratio_max: 0
  handeye_outlier_reject_quantile: 0.9
  handeye_outlier_max_iter: 2
  handeye_outlier_min_pairs: 15   # 旋转对少时 RANSAC 易失败，降低门槛
  handeye_ransac_enable: true
  handeye_ransac_inlier_thresh_deg: 3.0
  handeye_ransac_max_iter: 300
  trust_initial_rotation: false    # 0518 主雷达约 yaw90°：锁定 CAD/轴对齐旋转；B样条亦固定旋转
  # trust_initial_rotation: false  # 手眼比值差(≈0.05)时勿关，易 180° 歧义→≈单位阵
  trust_initial_translation: false # true=B样条完全锁定平移；更常用下面 freeze_trans_xy
  bspline_freeze_trans_xy: false  # 横向平移不可观时保持 CAD ty（避免 ty 被优化变号）
  bspline_auto_freeze_trans_when_underconstrained: true  # 平移有效约束<8 时自动固定 tx/ty
  bspline_max_trans_delta_m: 0.0 # >0 时限平移相对初值最大偏差，如 0.02
  use_planar_prior: false        # 大安装角时勿把 roll/pitch 压成 0°
  bspline_freeze_trans_z: false   # 固定前向 tz≈0.306 m（平面运动 z 不可观）
  min_roll_motion_deg: 3.0
  min_pitch_motion_deg: 3.0
  min_yaw_motion_deg: 3.0
  max_z_trans_ratio: 0.2
  enable_planar_warning: true
  ceres_max_iter: 50

# =============================================================================
# 10. LiDAR-LiDAR 外参 — 显式标定对
# =============================================================================
# pairs: 每项 [ref_lidar_id, target_lidar_id]，表示标定 T_target_in_ref
# 保留 lidar_list 兼容：未写 pairs 时可用 lidar_list 推导（相邻或全对）。
# 两阶段: 粗标定 (NDT/多帧合并) → 精标定 (GICP/NDT)
lidar_lidar:
  method: targetless       # targetless | motion
  # pairs: [ref, target] -> 标定 T_target_in_ref（目标雷达点在参考雷达坐标系下的位姿）
  pairs:
    - [lidar_main, left_front]
    # - [lidar_main, right_back]
    # - [left_front, right_back]
  lidar_list: [lidar_main, left_front, right_back]
  # 安装表 mm→m（与 IMU/雷达同一车体坐标、轴平行 R=I）：pairs [ref,target] → T_target_in_ref，t = (r_target - r_ref)/1000 [m]
  #   r_main=(776.16,876.11,0), r_left_front=(-37.49,530.31,430.63), r_right_back=(1539.14,705.48,-501.01)
  #   main→left_front: (-0.81365,-0.3458,0.43063)  main→right_back: (0.76298,-0.17063,-0.50101)
  # 手调外参写入 initial_extrinsics 后重跑：设 true 可跳过 GICP/B样条，手动窗口直接从 config 初值叠图（与 LiDAR-相机 同名选项）
  chain_imu_extrinsic: true
  chain_imu_ref: lidar_main
  chain_imu_id: imu_0
  use_config_extrinsic_only: true
  initial_extrinsics:
    T_lidar_main__left_front:
      rows: 4
      cols: 4
      dt: d
