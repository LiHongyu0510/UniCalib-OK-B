      rows: 4
      cols: 4
      dt: d
      data: [-0.99998520, 0.00271857, 0.00471333, -1.78188109,
             -0.00287821, -0.99941086, -0.03420016, 0.48139126,
             0.00461758, -0.03421322, 0.99940389, -0.17379859,
