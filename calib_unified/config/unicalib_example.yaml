  # 兼容旧配置：单块 initial_extrinsic 对所有 pairs 共用（多对时建议用上方 initial_extrinsics）
  # initial_extrinsic: !!opencv-matrix
  #   rows: 4
  #   cols: 4
  #   dt: d
  #   data: [ ... ]

  # 粗标定参数 (P0: FPFH+鲁棒位姿 默认开启，失败回退 NDT)
  coarse:
    use_fpfh_teaser: true
    fpfh_radius: 0.5
    teaser_noise_bound: 0.1
    gmm_max_iter: 50
    use_gmm: false   # P2 预留，当前为多帧合并+NDT

  # 精标定参数 (P1: 多帧 GICP 融合)
  fine:
    gicp_resolution: 1.0
    gicp_max_iter: 30
    use_multi_frame_fine: false
    fine_fusion_max_frames: 20
    fine_fusion_method: median   # single | median | weighted
    spline_dt_s: 0.1
    spline_order: 4
    optimize_time_offset: true

  # --manual 且用户 Enter 后自动 GICP 精化（手调约 3°/数 cm 内时推荐开启）
  post_manual_refine: true
  post_manual:
    enable: true
    use_multi_frame: true       # 多帧融合，比单帧肉眼对齐更稳
    two_stage_gicp: true        # 先大对应距离粗 GICP，再小体素/小距离精 GICP
    gicp_corr_dist_coarse: 1.0  # [m] 容纳 ~3° 初值（10m 处横向约 0.5m）
    gicp_corr_dist_fine: 0.35
    voxel_coarse: 0.08
    voxel_fine: 0.05
    gicp_max_iter: 40
    max_delta_deg: 5.0          # 相对手调的最大允许修正；超过则拒绝（防 ICP 错配）
    max_delta_m: 0.10
    min_overlap_ratio: 0.25

  # 通用参数
  voxel_size: 0.1             # 体素边长 [m]，默认 0.1；代码最小 0.001，越小点越多
  min_overlap_ratio: 0.3
  max_frames: 100             # 加载 PCD/bag 时最多用多少帧；设 ≥ 目录里 pcd 总数 ≈ 不跳帧

# =============================================================================
# 11. LiDAR-相机 外参 — 显式标定对
# =============================================================================
# pairs: 每项 [lidar_id, camera_id]，表示标定 T_camera_in_lidar
# 多 LiDAR、多相机时按需列举 (lidar, camera) 对。保留 camera_list 兼容单 LiDAR 多相机。
# 粗标定（--coarse / lidar-cam 默认）支持两种方式（同相机内参粗标定）：
#   1) 指定文件: coarse_pcd_file / coarse_image_file（相对 --data-dir 或绝对）
#   2) 不指定时从当前数据源取首帧: ROS2 bag/话题 或 文件目录（lidar/camera 目录）自动取第一帧
lidar_camera:
  # 按文件名时间戳自动匹配 LiDAR PCD 与相机图像（|Δt| <= frame_sync_threshold）
  auto_time_align: true
  method: target
  # 标定板类型 (method=target 时): chessboard | circles_grid | asym_circles
  # 圆点格说明: 对称/非对称均只需 board_cols、board_rows、square_size；非对称通常为奇数列×偶数行
  target_type: chessboard
  # circle_diameter_m: 0.0   # 可选，圆点格时圆直径 [m]，用于 LiDAR 端时可填
  # coarse_pcd_file: ""    # 可选；不填则从数据源首帧生成（ROS2 或文件目录）
  # coarse_image_file: ""  # 可选；不填则从数据源首帧生成
  # 粗标定增强（无初始值时）
  coarse:
    adaptive_search: true
    max_iterations: 3
    convergence_threshold: 0.01
    search_range_multiplier: 1.5
  # 初始值评估（无初始值时先评估再标定）
  initial_guess:
    enable: true
    min_confidence: 0.5
    feature_match_threshold: 0.7
  # 精标定可选参数
  fine:
    multi_feature:
      edge_weight: 0.5
      corner_weight: 0.3
      intensity_weight: 0.2   # 强度一致性（semantic 的轻量替代）
      corner_max_per_frame: 150
    robust_loss:
      use: true
      type: "huber"
      threshold: 2.0
    # 时间同步参数（扩大搜索范围以处理不同步数据）
    frame_sync_threshold: 1.0    # 帧同步阈值 [s]，扩大到 1.0s
    time_offset_search_range: 1.0  # 时间偏移搜索范围 [s]，扩大到 1.0s
    # NCC 阈值（降低以允许更多有效帧参与优化）
    ncc_threshold: 0.0         # NCC > 0.0 才参与优化（原 0.02 过于严格）
    # 运动补偿（对旋转式 LiDAR 进行运动畸变校正）
    motion_compensation:
      enable: false             # 默认关闭，需要时启用
      method: "linear"          # "linear" | "imu"
      max_time_s: 0.1           # 最大补偿时间范围 [s]
    # 混合标定配置（深度学习粗标定 + 传统精标定）
    hybrid_calibration:
      enable: true             # 目标法失败/超差时自动回退边缘对齐
      coarse_confidence_threshold: 0.5  # 粗标定置信度阈值，低于此值触发回退
      pyramid_levels: 3         # 多分辨率金字塔层数
      pyramid_iterations: 20    # 每层迭代次数
      pyramid_downscale: 0.5    # 金字塔降采样因子
      adaptive_strategy: true    # 自适应策略：基于质量选择方法
      quality_ncc_weight: 0.6  # 质量评估 NCC 权重
      quality_edge_weight: 0.4 # 质量评估边缘权重
    # 扩展特征约束（语义边缘、深度边缘、法向边缘）
    extended_features:
      enable: false            # 启用扩展特征
      # 特征权重配置（权重和应为 1.0）
      edge_weight: 0.4         # 传统强度边缘权重
      depth_edge_weight: 0.3   # 深度边缘权重
      normal_edge_weight: 0.2  # 法向边缘权重
      corner_weight: 0.1       # 角点权重
      # 边缘检测阈值
      semantic_threshold: 0.5  # 语义边缘阈值
      depth_threshold_m: 0.1   # 深度边缘阈值 [m]
      normal_threshold_deg: 30.0  # 法向边缘阈值 [度]
      feature_sample_step: 1   # 特征提取下采样步长
  # 质量评估阈值 + 自动验收（精标定后生成 quality_report.yaml，无需人工看投影图）
  quality:
    auto_assess: true           # 精标定后自动评估 PASS/FAIL
    edge_viz_enable: true       # 保存边缘对齐图（红=图像 绿=LiDAR 黄=重叠）
    bev_viz_enable: true        # 保存 LiDAR BEV 俯视图
    bev_range_m: 30.0           # BEV 显示范围 ±m
    bev_resolution: 512
    fail_on_bad_quality: false  # true 时 verdict=bad 则进程 exit_code=1（CI 门禁）
    ncc_good: 0.3
    ncc_acceptable: 0.2
    rms_good_px: 2.0
    rms_acceptable_px: 5.0
    chamfer_good_px: 3.0        # 边缘 Chamfer 距离阈值 [px]
    chamfer_acceptable_px: 6.0
    inlier_ratio_good: 0.6
    inlier_ratio_acceptable: 0.4
  # 单标 right_back ↔ surrounding_back 时建议仅保留下面一行 pairs，并注释 camera_list。
  # 日志应出现: 标定对 lidar_id=right_back camera_id=surrounding_back
  #              使用按相机初值 key=right_back__surrounding_back
  #              读取相机内参 sensor_id=surrounding_back fx≈516
  pairs:
    # - [lidar_main, center_front]
    - [lidar_main, surrounding_front]
    # - [lidar_main, surrounding_back]
    # - [lidar_main, surrounding_left]
    # - [lidar_main, surrounding_right]
    # 补盲 LiDAR-相机（有共识区，在上方主雷达对之外追加）
    # - [left_front, center_front]
    # - [left_front, surrounding_front]
    # - [left_front, surrounding_left]
    # - [right_back, surrounding_right]
    # - [right_back, surrounding_back]
  # 粗标定初值（可选）：若配置此项，作为粗标定阶段的输入；粗标定必执行，其结果为精标定初值。
  # 有此项时：无 MIAS-LCEC 或 MIAS-LCEC 无输入时直接用此项作为粗标定结果；MIAS-LCEC 失败时也可回退此项。
  # 为 true 时跳过 AI 粗标定与精标定，直接使用下方 initial_extrinsic 作为手动微调起始值（需配合 --manual）
  use_config_extrinsic_only: false
  # 支持键名 initial_extrinsic 或 T_cam_lidar（lidar→camera 4×4）。
 
