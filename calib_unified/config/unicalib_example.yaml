             0.079589546163451957, 0.059287983522394942, -0.99506303275287222, -0.24931249022483826,
             0.0, 0.0, 0.0, 1.0]
      # data: [0.95310819, 0.29615933, 0.06224492, 0.84047853,
      #        0.29821192, -0.95412983, -0.02656890, 0.48251480,
      #        0.05152110, 0.04388521, -0.99770720, -0.25948449,
      #        0.00000000, 0.00000000, 0.00000000, 1.00000000]

    T_lidar_main__right_back:
